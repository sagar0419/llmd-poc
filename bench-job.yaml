apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-bench-serve
  namespace: llmd
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-bench-serve
    spec:
      restartPolicy: Never
      containers:
      - name: bench
        image: vllm/vllm-openai:v0.34.0
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -u
          for c in 1 2 4 8 16 32 64 128; do
            n=$((c * 8)); [ "$n" -lt 20 ] && n=20
            echo ">>> concurrency=$c prompts=$n"
            # per-run timeout so a hung request cannot stall the sweep; distinct seed avoids prefix-cache reuse
            timeout 900 vllm bench serve \
              --backend openai-chat --endpoint /v1/chat/completions \
              --base-url "$BASE_URL" --model "$MODEL" \
              --dataset-name random --random-input-len 512 --random-output-len 128 \
              --num-prompts "$n" --request-rate inf --max-concurrency "$c" \
              --seed "$c" \
              --percentile-metrics ttft,tpot,itl,e2el,client_queue_time \
              --save-result --result-dir /results --result-filename "c${c}.json" \
              || echo "!!! concurrency=$c failed or timed out"
          done
          echo ">>> done; results in /results (sleeping 1h so they can be copied with kubectl cp)"
          sleep 3600
        env:
        - name: BASE_URL
          value: "http://qwen-epp.llmd.svc"
        - name: MODEL
          value: "Qwen/Qwen3-32B-AWQ"
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: token
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 8Gi
        volumeMounts:
        - name: results
          mountPath: /results
      volumes:
      - name: results
        emptyDir: {}
