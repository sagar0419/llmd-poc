apiVersion: v1
kind: Service
metadata:
  name: vllm-learn-headless
  namespace: llmd
  labels:
    app.kubernetes.io/name: vllm-learn
    app.kubernetes.io/component: inference-engine
    release: kube-prometheus-stack
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: vllm-learn
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vllm-learn
  namespace: llmd
  labels:
    app.kubernetes.io/name: vllm-learn
    app.kubernetes.io/component: inference-engine
    release: kube-prometheus-stack 
spec:
  serviceName: "vllm-learn-headless"
  replicas: 2
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-learn
      llm-d.ai/guide: "optimized-baseline"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-learn
        release: kube-prometheus-stack
        llm-d.ai/guide: "optimized-baseline"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: vllm-engine
        image: vllm/vllm-openai:v0.34.0
        imagePullPolicy: IfNotPresent
        command: ["vllm", "serve"]
        args:
        - "Qwen/Qwen3-32B-AWQ"
        - "--served-model-name"
        - "qwen"
        - "Qwen/Qwen3-32B-AWQ"
        - "--quantization"
        - "awq"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8000"
        - "--gpu-memory-utilization"
        - "0.90"
        - "--max-model-len"
        - "8192"
        - "--enable-prefix-caching"
        - "--tensor-parallel-size"
        - "1"
        - "--pipeline-parallel-size"
        - "1"
        - "--download-dir"
        - "/root/.cache/huggingface"
        - "--disable-custom-all-reduce"
        - "--enforce-eager"
        - "--max-num-seqs"
        - "128"
        - "--max-num-batched-tokens"
        - "4096"
        - "--enable-chunked-prefill"
        - "--reasoning-parser"
        - "qwen3"
        - "--default-chat-template-kwargs"
        - '{"enable_thinking": false}'
        env:
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: token
        - name: NCCL_DEBUG
          value: "WARN"
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
            # nvidia.com/mig-1g.20gb: "1"
          limits:
            cpu: "8"
            memory: "64Gi"
            nvidia.com/gpu: 1
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: model-cache
          mountPath: /root/.cache/huggingface
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 20Gi
  volumeClaimTemplates:
  - metadata:
      name: model-cache
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 40Gi
