apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qwen-router
  namespace: llmd
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"   # needed for streaming responses
spec:
  ingressClassName: nginx
  rules:
  - host: llm.test.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: qwen-epp
            port:
              number: 80